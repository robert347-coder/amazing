# Construye el APK de Amazing Tea en los servidores de GitHub cada vez que
# se suben cambios a la rama "amazing-tea" (o al pulsar "Run workflow").
# El APK queda en la pestaña "Releases" del repositorio, listo para
# descargarlo desde el móvil. No afecta a Amazing Jesús (rama "main").
name: Construir APK Amazing Tea

on:
  push:
    branches: [amazing-tea]
  workflow_dispatch:

permissions:
  contents: write   # necesario para publicar el APK en "Releases"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Instalar Capacitor
        run: npm install
      - name: Crear el proyecto Android con los iconos de la app
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#2F5D50' --splashBackgroundColor '#F7F3EA' --splashBackgroundColorDark '#161513' || echo "Iconos por defecto"
          npx cap sync android
      - name: Permitir la vibración al terminar el temporizador
        run: |
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.VIBRATE" />#' android/app/src/main/AndroidManifest.xml
      - name: Compilar el APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: amazing-tea-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar el APK en "Releases"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk AmazingTea.apk
          gh release create "tea-${{ github.run_number }}" AmazingTea.apk \
            --target amazing-tea \
            --title "Amazing Tea · versión ${{ github.run_number }}" \
            --notes "APK de Amazing Tea para uso personal. Sin cuentas ni internet: todo se guarda solo en el móvil. Descarga AmazingTea.apk e instálalo." \
            --latest=false
