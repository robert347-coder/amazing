<!doctype html>
<!-- =========================================================================
     AMAZING TEA · index.html
     Página principal. Solo carga los estilos, las recetas y la lógica.
     Todo funciona sin internet y sin enviar datos a ningún sitio.
     ========================================================================= -->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Amazing Tea</title>
  <meta name="theme-color" content="#2F5D50">
  <!-- Sin fuentes de Google a propósito: se usan las letras del propio móvil,
       así la app no se conecta a ningún servidor externo. -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="cabecera">
    <button class="cab-atras" id="btnAtras" aria-label="Volver" hidden>‹</button>
    <h1 id="titulo">Amazing Tea</h1>
    <button class="cab-ajustes" id="btnAjustes" aria-label="Ajustes">⚙</button>
  </header>

  <main id="app" aria-live="polite"></main>

  <!-- Barra inferior con las 4 secciones principales -->
  <nav class="barra" id="barra">
    <a href="#/" data-tab="inicio"><span>🍵</span>Inicio</a>
    <a href="#/recetas" data-tab="recetas"><span>📖</span>Recetas</a>
    <a href="#/pasaporte" data-tab="pasaporte"><span>🛂</span>Pasaporte</a>
    <a href="#/vitalidad" data-tab="vitalidad"><span>💪</span>Vitalidad</a>
  </nav>

  <script src="recetas.js"></script>
  <script src="app.js"></script>
</body>
</html>
